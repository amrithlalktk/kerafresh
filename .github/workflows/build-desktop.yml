name: Build desktop app

on:
  # Push a tag like desktop-v1.0.1 to cut a new release.
  push:
    tags:
      - "desktop-v*"
  # Lets you trigger a one-off build from the Actions tab, e.g. to test this
  # workflow without cutting a real release.
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerafresh-windows-installer
          path: desktop/dist/Kerafresh-Setup.exe
          retention-days: 7

      # Only publish a GitHub Release (and update the stable "latest" download
      # link the app uses) when this run came from an actual desktop-v* tag —
      # a manual workflow_dispatch run just produces the artifact above.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Kerafresh-Setup.exe
