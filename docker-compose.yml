services:
  app:
    build:
      context: .
      args:
        # Must match the runtime NEXT_PUBLIC_CURRENCY below — this one feeds
        # the client bundle at build time, the one under `environment` feeds
        # server-rendered pages at runtime.
        NEXT_PUBLIC_CURRENCY: "INR"
    ports:
      - "3000:3000"
    environment:
      # Change this before exposing the app beyond your own machine.
      SESSION_SECRET: "9f8e7b5d8c8fd0af5ea1eaf2b8d5474596348acaacc9133b6ac62d9ae4519d0e"
      NEXT_PUBLIC_CURRENCY: "INR"
    volumes:
      # Persists the SQLite database across container restarts/rebuilds.
      - kerafresh-data:/app/data

volumes:
  kerafresh-data:
